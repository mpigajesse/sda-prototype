version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Reverse Proxy — TLS 1.3 + mTLS (authentification mutuelle x509)
  # Générer les certificats d'abord : bash scripts/generate-certs.sh
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: sda-nginx
    ports:
      - "443:443"   # HTTPS (TLS 1.3 uniquement)
      - "80:80"     # Redirection HTTP → HTTPS
    volumes:
      - ./config/nginx/nginx.conf.template:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - sda-backend
      - sda-frontend
    restart: unless-stopped

  sda-backend:
    build: ./backend
    container_name: sda-backend
    # Port 8000 interne uniquement — exposé via Nginx en TLS
    expose:
      - "8000"
    volumes:
      - ./data/db:/app/data/db
      - ./data/shared_storage:/app/data/shared_storage
    environment:
      - DB_SQLITE_PATH=/app/data/db/metadata_enc.db
      - DB_DUCKDB_PATH=/app/data/db/analytics.duckdb
      - SHARED_STORAGE_PATH=/app/data/shared_storage
      # Active SQLCipher — désactivé en CI (pysqlcipher3 absent hors Docker)
      - SQLITE_ENCRYPTION_ENABLED=true
      # Clés de chiffrement — injecter via .env ou Docker secrets en production
      # Générer : python -c "import secrets; print(secrets.token_hex(32))"
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-changeme-replace-in-production}
      # Générer : python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - PARQUET_FERNET_KEY=${PARQUET_FERNET_KEY:-}
    depends_on: []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  sda-frontend:
    build: ./frontend
    container_name: sda-frontend
    expose:
      - "3000"
    depends_on:
      - sda-backend
      - syncthing
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  syncthing:
    image: syncthing/syncthing:latest
    container_name: sda-syncthing
    ports:
      - "8384:8384"       # Web GUI (local uniquement)
      - "22000:22000"     # P2P sync (TCP)
      - "22000:22000/udp" # P2P sync (QUIC)
      - "21027:21027/udp" # mDNS local discovery
    volumes:
      - ./config/syncthing:/var/syncthing/config
      - ./data/shared_storage:/var/syncthing/SDA_Shared
    environment:
      - PUID=1000
      - PGID=1000
    restart: unless-stopped

volumes:
  db_data:
  syncthing_config:
