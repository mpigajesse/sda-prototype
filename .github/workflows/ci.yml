name: SDA — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Job 1 : Tests unitaires + couverture (cible > 80%)
  # -------------------------------------------------------------------------
  test:
    name: Tests & Couverture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances système (SQLCipher)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlcipher-dev gcc python3-dev

      - name: Installer les dépendances Python
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Lancer les tests avec couverture
        run: |
          pytest --cov=backend/app \
                 --cov-report=term-missing \
                 --cov-fail-under=80 \
                 -v
        env:
          DB_ENCRYPTION_KEY: "test-key-ci-only-not-production"
          PARQUET_FERNET_KEY: ""

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  # -------------------------------------------------------------------------
  # Job 2 : Scan sécurité statique Bandit (cible : 0 HIGH/CRITICAL)
  # -------------------------------------------------------------------------
  security-bandit:
    name: Scan Sécurité (Bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Bandit
        run: pip install bandit==1.7.5

      - name: Scan Bandit
        run: |
          bandit -r backend/app/ \
                 -f json \
                 -o bandit-report.json \
                 --severity-level medium \
                 || true

      - name: Afficher le rapport
        run: bandit -r backend/app/ --severity-level medium

      - name: Publier rapport Bandit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # -------------------------------------------------------------------------
  # Job 3 : Build Docker (validation de l'image)
  # -------------------------------------------------------------------------
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image backend
        run: |
          docker build \
            --tag sda-backend:ci-${{ github.sha }} \
            ./backend

      - name: Vérifier la taille de l'image (< 500 MB)
        run: |
          SIZE=$(docker image inspect sda-backend:ci-${{ github.sha }} \
                 --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "Taille image : ${SIZE} MB"
          if [ "$SIZE" -gt 500 ]; then
            echo "ERREUR : Image trop volumineuse (${SIZE} MB > 500 MB)"
            exit 1
          fi
