worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # TLS 1.3 uniquement — interdit SSLv3, TLS 1.0, TLS 1.1, TLS 1.2
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Certificat serveur x509 signé par la CA interne
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Authentification mutuelle (mTLS) : le client doit présenter un certificat
    # signé par la CA interne (trust perimeter SDA)
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS — force HTTPS pour 1 an
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------------------------------------------------
    # Backend API — https://<node>:443  →  http://sda-backend:8000
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        location /api/ {
            proxy_pass         http://sda-backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Passe le DN du certificat client au backend pour audit
            proxy_set_header   X-Client-DN       $ssl_client_s_dn;
        }

        location /health {
            proxy_pass http://sda-backend:8000/health;
        }

        location /docs {
            proxy_pass http://sda-backend:8000/docs;
        }

        location /redoc {
            proxy_pass http://sda-backend:8000/redoc;
        }

        # -----------------------------------------------------------------------
        # Frontend React — https://<node>:443/
        # -----------------------------------------------------------------------
        location / {
            proxy_pass         http://sda-frontend:3000;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
        }
    }

    # Redirection HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
